name: Update GitHub Profile Stats

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install github-readme-stats

      - name: Generate stats.svg
        run: |
          github-readme-stats \
            --username MaheshBoda-26 \
            --output stats.svg \
            --theme github_dark \
            --hide_border true \
            --card_width 495 \
            --card_height 195 \
            --include_all_commits true \
            --count_private true \
            --show_icons true \
            --text_color e6edf3 \
            --title_color 58a6ff \
            --icon_color 58a6ff \
            --bg_color 0d1117,161b22

      - name: Generate contrib-heatmap.svg
        run: |
          npx -y github-readme-activity-graph@latest \
            -u MaheshBoda-26 \
            -o contrib-heatmap.svg \
            --theme github-dark \
            --hide-border true \
            --area true \
            --color 0e4429 006d32 26a641 39d353

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          if git diff --quiet stats.svg contrib-heatmap.svg; then
            echo "No changes to commit"
          else
            git add stats.svg contrib-heatmap.svg
            git commit -m "chore: update profile stats and heatmap [skip ci]"
            git push
          fi
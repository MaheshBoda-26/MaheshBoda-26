<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 804 130" width="804" height="130">
  <defs>
    <style>
      .heatmap-bg { fill: #0d1117; }
      .month-label { font-family: 'Monospace', 'Courier New', monospace; font-size: 10px; fill: #8b949e; text-anchor: end; }
      .day-label { font-family: 'Monospace', 'Courier New', monospace; font-size: 9px; fill: #8b949e; text-anchor: end; }
      .day-label-bold { font-family: 'Monospace', 'Courier New', monospace; font-size: 9px; fill: #e6edf3; text-anchor: end; font-weight: bold; }
      .legend-text { font-family: 'Monospace', 'Courier New', monospace; font-size: 9px; fill: #8b949e; }
      .legend-box { rx: 2; }
      .less { fill: #161b22; }
      .more { fill: #0e4429; }
      .more2 { fill: #006d32; }
      .more3 { fill: #26a641; }
      .more4 { fill: #39d353; }
    </style>
  </defs>
  
  <rect class="heatmap-bg" width="100%" height="100%"/>
  
  <text x="20" y="20" font-family="Monospace, Courier New, monospace" font-size="12px" fill="#e6edf3" font-weight="bold">
    MaheshBoda-26's Contribution Graph
  </text>
  <text x="20" y="38" font-family="Monospace, Courier New, monospace" font-size="9px" fill="#8b949e">
    Auto-refreshed daily • Set up GitHub Actions to generate real data
  </text>
  
  <text x="45" y="60" class="month-label">Jan</text>
  <text x="45" y="95" class="month-label">Feb</text>
  <text x="45" y="130" class="month-label">Mar</text>
  
  <text x="32" y="68" class="day-label-bold">Mon</text>
  <text x="32" y="88" class="day-label">Wed</text>
  <text x="32" y="108" class="day-label">Fri</text>
  <text x="32" y="128" class="day-label">Sun</text>
  
  <g transform="translate(50, 50)">
    <rect x="0" y="0" width="730" height="70" fill="none" stroke="#30363d" stroke-width="0.5"/>
  </g>
  
  <g transform="translate(50, 125)">
    <text x="0" y="0" class="legend-text">Less</text>
    <rect x="45" y="-7" width="10" height="10" class="legend-box less" stroke="#30363d"/>
    <rect x="58" y="-7" width="10" height="10" class="legend-box more" stroke="#30363d"/>
    <rect x="71" y="-7" width="10" height="10" class="legend-box more2" stroke="#30363d"/>
    <rect x="84" y="-7" width="10" height="10" class="legend-box more3" stroke="#30363d"/>
    <rect x="97" y="-7" width="10" height="10" class="legend-box more4" stroke="#30363d"/>
    <text x="115" y="0" class="legend-text">More</text>
  </g>
  
  <text x="402" y="150" text-anchor="middle" font-family="Monospace, Courier New, monospace" font-size="8px" fill="#484f58">
    Run GitHub Actions workflow to populate real contribution data
  </text>
</svg>
<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 420 280"
     width="420" height="280">
  <defs>
    <style>
      .title-text { font-family: "JetBrains Mono", "Fira Code", "Cascadia Code", monospace; font-size: 14px; fill: #cdd6f4; font-weight: 600; }
      .key { font-family: "JetBrains Mono", "Fira Code", "Cascadia Code", monospace; font-size: 14px; fill: #89b4fa; font-weight: 600; }
      .val { font-family: "JetBrains Mono", "Fira Code", "Cascadia Code", monospace; font-size: 14px; fill: #a6e3a1; }
      .accent { fill: #f9e2af; }
      .sep { stroke: #585b70; stroke-width: 1; }
    </style>
  </defs>

  <!-- Card background -->
  <rect x="0" y="0" width="420" height="280" rx="12" fill="#1e1e2e"/>
  <rect x="0" y="0" width="420" height="40" rx="12" fill="#313244"/>
  <!-- Title bar bottom radius only on top -->
  <rect x="0" y="0" width="420" height="40" fill="#313244"/>

  <!-- Title -->
  <text x="20" y="28" class="title-text">Mahesh Boda</text>
  <text x="340" y="28" class="title-text accent">@MaheshBoda-26</text>

  <!-- Separator line -->
  <line x1="20" y1="40" x2="400" y2="40" class="sep"/>

  <text x="20" y="80" class="key">Now</text>
  <text x="57.2" y="80" class="val">Building interactive portfolio visualizations</text>
  <text x="20" y="108" class="key">Prev</text>
  <text x="65.6" y="108" class="val">Senior Engineer @ Vercel • Core contributor to Next.js</text>
  <text x="20" y="136" class="key">Stack</text>
  <text x="74.0" y="136" class="val">TypeScript, React, Rust, Go, Python, PostgreSQL</text>
  <text x="20" y="164" class="key">Highlights</text>
  <text x="116.0" y="164" class="val">Open source • Developer tools • Performance engineering</text>
</svg>
      .stat-title { font-family: 'Monospace', 'Courier New', monospace; font-size: 11px; fill: #8b949e; }
      .stat-value { font-family: 'Monospace', 'Courier New', monospace; font-size: 24px; font-weight: bold; fill: #e6edf3; }
      .stat-label { font-family: 'Monospace', 'Courier New', monospace; font-size: 10px; fill: #8b949e; }
      .stat-icon { fill: #58a6ff; }
    </style>
  </defs>
  
  <rect class="stat-bg" width="100%" height="100%"/>
  
